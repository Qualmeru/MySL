# Runs on every push to any branch and on every pull request: unit tests, a debug and a release
# build, and a check that R8 didn't strip anything the release APK needs at runtime.
# Release APKs for publishing are built by android-release.yml instead.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests and builds
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # Same packages as android-release.yml; see the note there.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Unit tests
        run: ./gradlew --no-daemon testStandardDebugUnitTest testPresetDebugUnitTest

      # Catches what unit tests can't, e.g. calling an Android API newer than minSdk (a crash on
      # older phones). Only errors fail the build; warnings are in the uploaded report.
      - name: Lint
        run: ./gradlew --no-daemon lintStandardDebug

      # No signing key here: the release build is signed with the runner's debug key, which is
      # fine for checking that it builds. It's not published.
      - name: Debug and release builds
        run: ./gradlew --no-daemon assembleStandardDebug assembleStandardRelease

      - name: Check R8 kept the app's entry points
        run: bash scripts/check-release-dex.sh app/build/outputs/apk/standard/release/app-standard-release.apk

      - name: Report APK sizes
        run: |
          {
            echo "| APK | Size |"
            echo "|-----|------|"
            for apk in app/build/outputs/apk/standard/*/*.apk; do
              echo "| $(basename "$apk") | $(du -h "$apk" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
