# Builds signed release APKs and attaches them to the GitHub release. See README, "Automatic release builds".
name: Android release builds

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APKs
    runs-on: ubuntu-latest

    steps:
      # Full history and tags, so the version check can find the previous release.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Before anything slow: the tag must match versionName, and versionCode must have gone up.
      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/check-release-version.sh "$GITHUB_REF_NAME"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # List the packages explicitly: the default ("tools platform-tools") fails on newer
      # command-line tools, which no longer have a "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      # Without the release key Gradle would sign with this runner's throwaway debug key,
      # and those APKs wouldn't install over existing copies. So no key, no build.
      - name: Set up release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MYSL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MYSL_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the MYSL_KEYSTORE_BASE64 and MYSL_KEYSTORE_PASSWORD repository secrets (see README, 'Signing')."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mysl-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/mysl-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=mysl
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      # Never publish a version whose tests fail.
      - name: Unit tests
        run: ./gradlew --no-daemon testStandardDebugUnitTest testPresetDebugUnitTest

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleStandardRelease assemblePresetRelease

      - name: Check R8 kept the app's entry points
        run: |
          bash scripts/check-release-dex.sh app/build/outputs/apk/standard/release/*.apk
          bash scripts/check-release-dex.sh app/build/outputs/apk/preset/release/*.apk

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/*.apk dist/MySL.apk
          cp app/build/outputs/apk/preset/release/*.apk dist/MySL-preset.apk
          cd dist
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: android-release-apks
          path: dist

      # Just the release notes (release-notes/<tag>.md) and the script that publishes them.
      - name: Check out release notes
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            release-notes
            scripts
          path: src

      # The checkout is in src/, so tell gh which repository to use.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash src/scripts/publish-release.sh "$GITHUB_REF_NAME" "src/release-notes/$GITHUB_REF_NAME.md" dist
